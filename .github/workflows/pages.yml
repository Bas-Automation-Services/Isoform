# Publishes the playground (the kernel in WebAssembly, compiled ahead of time) to GitHub Pages on every push to main.
name: Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - run: dotnet publish src/Isoform.Playground -c Release -o out/playground
      - run: touch out/playground/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/playground/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4
